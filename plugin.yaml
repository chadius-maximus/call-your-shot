name: call-your-shot
version: "0.1.0"
description: "The agent calls its shot before a multi-step task (tool calls and minutes), hooks measure what really happened, and a scoreboard shows how far off it was. The next shot's result tells the agent its own record so it can adjust."
author: "chadius-maximus"
requires_hermes: ">=0.23.0"
provides_tools:
  - call_shot
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - post_llm_call
  - on_session_end
